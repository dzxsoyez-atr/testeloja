<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxHub | Scripts & Itens Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f0f13;
            --bg-card: #1a1a24;
            --text-main: #f0f0f5;
            --neon-purple: #9d4edd;
            --neon-blue: #00f5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* Header e Botão de Login */
        header {
            background-color: rgba(26, 26, 36, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-purple);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--neon-blue); }

        .btn-login-nav {
            background: rgba(157, 78, 221, 0.2);
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-login-nav:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* ----- MODAL DE LOGIN / CADASTRO ----- */
        .modal-overlay {
            display: none; /* Escondido por padrão */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--bg-card);
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
            position: relative;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .close-modal:hover { color: var(--neon-purple); }

        .modal-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        .input-group { margin-bottom: 1.2rem; }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #a0a0b5;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f0f13;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, var(--neon-purple), #7b2cbf);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-form {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a0a0b5;
        }

        .toggle-form span {
            color: var(--neon-blue);
            cursor: pointer;
            font-weight: 600;
        }

        .toggle-form span:hover { text-decoration: underline; }

        /* Ocultar form de registro por padrão */
        #register-form { display: none; }

        /* Banner Principal Simplificado para foco no código novo */
        .hero {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a24 0%, var(--bg-dark) 100%);
        }
        .hero h1 { font-size: 3.5rem; text-shadow: 0 0 10px rgba(157, 78, 221, 0.5); }
    </style>
</head>
<body>

    <header>
        <div class="logo">BloxHub</div>
        <nav>
            <ul>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Suporte</a></li>
                <li><button class="btn-login-nav" onclick="openModal()">Entrar</button></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Sua Conta Premium</h1>
            <p>Faça login para gerenciar suas compras e keys ativas.</p>
        </div>
    </section>

    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            
            <div id="login-form">
                <h2 class="modal-title">Acessar Conta</h2>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button class="btn-submit">Entrar no Painel</button>
                <div class="toggle-form">
                    Não tem uma conta? <span onclick="toggleForms()">Criar agora</span>
                </div>
            </div>

            <div id="register-form">
                <h2 class="modal-title">Criar Perfil</h2>
                <div class="input-group">
                    <label>Nome de Usuário (Roblox)</label>
                    <input type="text" placeholder="Seu nick no jogo" required>
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Crie uma senha forte" required>
                </div>
                <button class="btn-submit">Registrar</button>
                <div class="toggle-form">
                    Já possui conta? <span onclick="toggleForms()">Fazer login</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        const modal = document.getElementById('authModal');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        // Abre o modal
        function openModal() {
            modal.style.display = 'flex';
        }

        // Fecha o modal
        function closeModal() {
            modal.style.display = 'none';
        }

        // Alterna entre a tela de Login e a tela de Cadastro
        function toggleForms() {
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        // Fecha o modal se clicar fora da caixa preta
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>

</body>
</html>
